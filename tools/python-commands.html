<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python 常用函数合集</title>
<style>
:root{
  --primary:#3776ab; --primary-dark:#2b5d87;
  --bg:#f3f6fa; --card:#ffffff; --text:#1f2a37; --muted:#6b7785; --border:#e1e7ef;
}
*{box-sizing:border-box;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.6;}
header{background:linear-gradient(135deg,#3776ab,#2b5d87); color:#fff; padding:22px 16px; text-align:center;}
header h1{margin:0; font-size:22px;}
header p{margin:4px 0 0; font-size:13px; opacity:.92;}
.wrap{max-width:820px; margin:0 auto; padding:18px 16px 50px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:14px;}
.search{position:relative;}
.search input{width:100%; padding:13px 16px 13px 42px; border:1px solid var(--border); border-radius:11px; font-size:15px; background:#fff; color:var(--text); font-family:inherit;}
.search input:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px rgba(55,118,171,.15);}
.search .ic{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--muted);}
.stat{font-size:13px; color:var(--muted); margin:10px 2px 4px;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px;}
.chip{padding:5px 13px; border:1px solid var(--border); border-radius:999px; font-size:13px; background:#fff; color:var(--muted); cursor:pointer; transition:.12s; font-family:inherit;}
.chip:hover{border-color:var(--primary); color:var(--primary);}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff;}
.cmd{border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px; background:#fff;}
.cmd .top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;}
.cmd .name{font-family:"SFMono-Regular",Consolas,Menlo,monospace; font-size:15px; font-weight:700; color:var(--primary-dark);}
.cmd .cat{margin-left:auto; font-size:12px; padding:2px 10px; border-radius:999px; background:#eef4fa; color:var(--primary);}
.cmd .zh{font-size:14px; margin:2px 0 8px;}
.cmd pre{margin:0; background:#1f2a37; color:#e6edf3; border-radius:10px; padding:12px 14px; overflow:auto; font-size:13px; line-height:1.55; font-family:"SFMono-Regular",Consolas,Menlo,monospace;}
.copy{margin-top:8px; border:none; border-radius:8px; padding:6px 14px; font-size:12px; font-weight:600; background:#eef4fa; color:var(--primary-dark); cursor:pointer; font-family:inherit;}
.copy:hover{background:#dde9f6;}
.empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:14px;}
.hint{font-size:12px; color:var(--muted); margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐍 Python 常用函数合集</h1>
    <p>常用 Python 函数速查 · 输入中文关键字即可带出相关函数与语法示例</p>
  </header>

  <div class="card search">
    <span class="ic">🔍</span>
    <input id="kw" type="text" placeholder="输入中文关键字，如：列表、排序、请求、正则、时间、读取、随机…" autocomplete="off">
    <div class="hint">支持按「中文说明 / 关键字 / 英文函数名」匹配，多个词空格分隔取交集。</div>
  </div>

  <div class="stat" id="stat"></div>
  <div class="chips" id="chips"></div>

  <div id="results"></div>
</div>

<script>

  {name:'os.path.exists', cat:'文件目录', zh:'判断路径（文件或目录）是否存在', syn:"import os\nif os.path.exists('x.txt'):\n    print('存在')", kw:['判断','存在','检查','路径','是否存在']},
  {name:'os.path.isfile / isdir', cat:'文件目录', zh:'分别判断路径是文件还是目录', syn:"import os\nos.path.isfile('a.txt')   # True\os.path.isdir('folder')  # True", kw:['判断','文件','目录','类型','是文件','是目录']},

  {name:'open / write', cat:'文件读写', zh:'以写模式打开并向文件写入内容（覆盖）', syn:"with open('a.txt', 'w', encoding='utf-8') as f:\n    f.write('hello')", kw:['写入','写文件','保存','输出','文件','覆盖']},
  {name:'open / readlines', cat:'文件读写', zh:'按行读取文件并返回行列表', syn:"with open('a.txt', encoding='utf-8') as f:\n    lines = f.readlines()", kw:['读取','行','逐行','文件','列表','文本']},

  {name:'any / all', cat:'列表字典', zh:'any 判断是否有任意一个为真；all 判断是否全部为真', syn:"any([0, '', 1])   # True\nall([1, 2, 3])    # True", kw:['任意','全部','判断','布尔','any','all']},

];

const allCats = Array.from(new Set(CMDS.map(c => c.cat)));

const kwInput = document.getElementById('kw');
const chipsBox = document.getElementById('chips');
const results = document.getElementById('results');
const stat = document.getElementById('stat');

let activeCat = '全部';

function renderChips(){
  chipsBox.innerHTML = '';
  ['全部', ...allCats].forEach(cat => {
    const b = document.createElement('button');
    b.className = 'chip' + (cat === activeCat ? ' active' : '');
    b.textContent = cat;
    b.onclick = () => { activeCat = cat; renderChips(); render(); };
    chipsBox.appendChild(b);
  });
}

function matchCmd(c, terms){
  if (activeCat !== '全部' && c.cat !== activeCat) return false;
  if (terms.length === 0) return true;
  const hay = (c.zh + ' ' + c.kw.join(' ') + ' ' + c.name).toLowerCase();
  // 所有关键字都必须命中（空格取交集）
  return terms.every(t => hay.includes(t));
}

function copyCode(btn, code){
  navigator.clipboard?.writeText(code).then(() => {
    const old = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = old, 1200);
  });
}

function render(){
  const raw = kwInput.value.trim().toLowerCase();
  const terms = raw.split(/\s+/).filter(Boolean);
  const list = CMDS.filter(c => matchCmd(c, terms));
  stat.textContent = `共收录 ${CMDS.length} 个常用函数，当前匹配 ${list.length} 个` + (terms.length ? `（关键字：${terms.join(' / ')}）` : '');
  results.innerHTML = '';
  if (list.length === 0){
    results.innerHTML = '<div class="empty">没有匹配的函数，换个关键字试试～</div>';
    return;
  }
  list.forEach(c => {
    const card = document.createElement('div');
    card.className = 'cmd';
    card.innerHTML =
      '<div class="top"><span class="name"></span><span class="cat"></span></div>' +
      '<div class="zh"></div>' +
      '<pre></pre>' +
      '<button class="copy">复制代码</button>';
    card.querySelector('.name').textContent = c.name;
    card.querySelector('.cat').textContent = c.cat;
    card.querySelector('.zh').textContent = c.zh;
    card.querySelector('pre').textContent = c.syn;
    const btn = card.querySelector('.copy');
    btn.onclick = () => copyCode(btn, c.syn);
    results.appendChild(card);
  });
}

kwInput.addEventListener('input', render);
renderChips();
render();
</script>

</html>
