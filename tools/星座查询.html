<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星座查询 · 小工具箱</title>
<style>
:root{--primary:#8a5a2b;--bg:#f6f1e7;--border:#e4d8c4;--card:#fffdf8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:#3d2f1e;min-height:100vh;}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 40px;}
header.site{background:linear-gradient(135deg,#a06a33,#8a5a2b);color:#fff;border-radius:14px;padding:18px 22px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header.site h1{font-size:22px;letter-spacing:1px;}
header.site a{color:#f3e3cb;text-decoration:none;font-size:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:20px;box-shadow:0 2px 6px rgba(138,90,43,.06);}
.card h2{font-size:17px;color:var(--primary);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.num{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--primary);color:#fff;font-size:13px;align-items:center;justify-content:center;flex:none;}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:130px;}
label{font-size:13px;color:#7a6647;}
select,input{padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:15px;background:#fff;color:#3d2f1e;outline:none;}
select:focus,input:focus{border-color:var(--primary);}
button{background:linear-gradient(135deg,#a06a33,#8a5a2b);color:#fff;border:none;border-radius:8px;padding:11px 28px;font-size:15px;cursor:pointer;letter-spacing:2px;}
button:hover{filter:brightness(1.08);}
.result{margin-top:18px;display:none;}
.zodiac-hero{text-align:center;padding:18px;border:1px dashed var(--border);border-radius:10px;background:#faf5ea;margin-bottom:16px;}
.zodiac-hero .big{font-size:44px;line-height:1.2;}
.zodiac-hero .name{font-size:26px;color:var(--primary);font-weight:bold;margin-top:4px;}
.zodiac-hero .range{font-size:13px;color:#9b8564;margin-top:4px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
.info{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#faf5ea;}
.info .k{font-size:12px;color:#9b8564;margin-bottom:4px;}
.info .v{font-size:17px;font-weight:bold;color:#3d2f1e;}
.info .sub{font-size:12px;color:#7a6647;font-weight:normal;margin-top:3px;}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;margin-right:6px;margin-top:4px;}
.wx-jin{background:#fbe9c6;color:#8a5a00;} .wx-mu{background:#dcedc8;color:#33691e;}
.wx-shui{background:#d6eaf8;color:#1a5276;} .wx-huo{background:#fadbd8;color:#922b21;}
.wx-tu{background:#ede0cf;color:#6e4b1e;}
.note{font-size:12px;color:#9b8564;margin-top:14px;line-height:1.8;}
.err{color:#b03a2e;font-size:14px;margin-top:10px;display:none;}
footer{text-align:center;font-size:12px;color:#a89472;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
<header class="site">
  <h1>✨ 星座查询</h1>
  <a href="index.html">← 返回小工具箱</a>
</header>

<div class="card">
  <h2><span class="num">1</span>输入农历生日（年 / 月 / 日 / 闰月）</h2>
  <div class="row">
    <div class="field"><label>农历年份</label><select id="year"></select></div>
    <div class="field"><label>农历月份</label><select id="month"></select></div>
    <div class="field" style="max-width:110px;"><label>闰月</label><select id="leap"><option value="0">否</option><option value="1">闰月</option></select></div>
    <div class="field" style="max-width:110px;"><label>农历日</label><select id="day"></select></div>
  </div>
  <button onclick="query()">查 询</button>
  <div class="err" id="err"></div>

  <div class="result" id="result">
    <div class="zodiac-hero">
      <div class="big" id="zIcon"></div>
      <div class="name" id="zName"></div>
      <div class="range" id="zRange"></div>
    </div>
    <h2><span class="num">2</span>生辰八字 · 五行 · 生肖</h2>
    <div class="grid">
      <div class="info"><div class="k">生肖属相</div><div class="v" id="rSX"></div></div>
      <div class="info"><div class="k">年柱（干支）</div><div class="v" id="rYZ"></div><div class="sub" id="rYX"></div></div>
      <div class="info"><div class="k">月柱（干支）</div><div class="v" id="rMZ"></div><div class="sub" id="rMX"></div></div>
      <div class="info"><div class="k">日柱（干支）</div><div class="v" id="rDZ"></div><div class="sub" id="rDX"></div></div>
      <div class="info"><div class="k">五行统计</div><div class="v" style="font-size:14px;" id="rWX"></div></div>
      <div class="info"><div class="k">对应公历生日</div><div class="v" style="font-size:16px;" id="rSolar"></div></div>
    </div>
    <div class="note" id="rTraits"></div>
  </div>
</div>

<div class="card">
  <h2><span class="num">3</span>说明</h2>
  <p class="note">
    · 本工具完全在本地浏览器运行，不联网、不上传任何数据。<br>
    · 农历范围支持 1900—2100 年，采用标准农历数据表换算为公历后推算星座。<br>
    · 年柱以立春为界，月柱按节气（立春、惊蛰、清明……）划分，日柱按公历连续推算。<br>
    · 八字仅含年、月、日三柱六字；时辰未输入故不含时柱。结果仅供参考娱乐。
  </p>
</div>

<footer>🔒 所有计算均在您的浏览器本地完成，数据不会上传任何服务器。</footer>
</div>

<script>

const LUNAR_INFO=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,

0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,

0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
0x0d520];
const LUNAR_START=1900;
function lunarYearDays(y){
  let sum=348;
  for(let i=0x8000;i>0x8;i>>=1) sum+=(LUNAR_INFO[y-LUNAR_START]&i)?1:0;
  return sum+leapDays(y);
}
function leapMonth(y){return LUNAR_INFO[y-LUNAR_START]&0xf;}
function leapDays(y){return leapMonth(y)?((LUNAR_INFO[y-LUNAR_START]&0x10000)?30:29):0;}
function monthDays(y,m){return (LUNAR_INFO[y-LUNAR_START]&(1<<(16-m)))?30:29;}
/* 农历日期 -> 公历 Date */
function lunarToSolar(y,m,d,isLeap){
  let offset=0;
  for(let i=LUNAR_START;i<y;i++) offset+=lunarYearDays(i);
  const lm=leapMonth(y);
  for(let i=1;i<m;i++){offset+=monthDays(y,i);if(i===lm)offset+=leapDays(y);}
  if(isLeap&&m===lm) offset+=monthDays(y,m);
  else if(isLeap) return null;
  offset+=d-1;
  const base=Date.UTC(1900,0,31);
  return new Date(base+offset*86400000);
}
/* 公历 Date -> 干支 */
const GAN='甲乙丙丁戊己庚辛壬癸',ZHI='子丑寅卯辰巳午未申酉戌亥';
const WX_GAN=['木','木','火','火','土','土','金','金','水','水'];
const WX_ZHI=['水','土','木','木','土','火','火','土','金','金','土','水'];
const SX=['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
function ganzhiOf(index){return GAN[index%10]+ZHI[index%12];}
function wuxingStr(gz){return '<span class="tag wx-'+mapWx(WX_GAN[GAN.indexOf(gz[0])])+'">'+gz[0]+'·'+WX_GAN[GAN.indexOf(gz[0])]+'</span><span class="tag wx-'+mapWx(WX_ZHI[ZHI.indexOf(gz[1])])+'">'+gz[1]+'·'+WX_ZHI[ZHI.indexOf(gz[1])]+'</span>';}
function mapWx(w){return {金:'jin',木:'mu',水:'shui',火:'huo',土:'tu'}[w];}
/* 日柱基准：1900-01-01 为甲戌日(序10) */
function dayGZ(date){
  const days=Math.floor((date-Date.UTC(1900,0,1))/86400000);
  const idx=(days+10)%60; return idx<0?idx+60:idx;
}
/* 节气：经验积日公式 F = 365.242*(y-1900) + 6.2 + 15.22*x - 1.9*sin(0.262*x)
   F 为“积日”（1 = 1900-01-01，基准日为 1900年1月0日），
   x 为标准24节气序：0小寒 1大寒 2立春 … 23冬至。精度约±1日。 */
function sTermDate(y,x){
  const F=365.242*(y-1900)+6.2+15.22*x-1.9*Math.sin(0.262*x);
  return new Date(Date.UTC(1899,11,31)+Math.floor(F)*86400000); // 积日F → 公历
}
/* 某年 M 月“节”（定月之节气）的日期：
   M=1→小寒(x0)，M=2→立春(x2)，M≥3→x=(M-1)*2。 */
function jieDay(y,M){return sTermDate(y,M===1?0:(M-1)*2).getUTCDate();}

/* ================= 星座 ================= */
function zodiacOf(m,d){ // 公历
  const edges=[[1,20,'♒','水瓶座'],[2,19,'♓','双鱼座'],[3,21,'♈','白羊座'],[4,20,'♉','金牛座'],
   [5,21,'♊','双子座'],[6,22,'♋','巨蟹座'],[7,23,'♌','狮子座'],[8,23,'♍','处女座'],
   [9,23,'♎','天秤座'],[10,24,'♏','天蝎座'],[11,22,'♐','射手座'],[12,22,'♑','摩羯座']];
  let cur=edges[11];
  for(const e of edges){if(m===e[0]&&d>=e[1]||m>e[0])cur=e;}
  return cur;
}
const Z_TRAITS={
 '水瓶座':'创新独立，思想前卫，理性博爱。五行象意近「水」，聪慧流动。',
 '双鱼座':'温柔浪漫，直觉敏锐，富同情心。五行象意近「水」，包容善感。',
 '白羊座':'热情直率，行动力强，勇敢开拓。五行象意近「火」，阳刚进取。',

};
const Z_ELEMENT={'水瓶座':'水','双鱼座':'水','白羊座':'火','金牛座':'土','双子座':'水','巨蟹座':'水','狮子座':'火','处女座':'土','天秤座':'金','天蝎座':'水','射手座':'火','摩羯座':'土'};
const SX_ELEMENTS={'鼠':'水','牛':'土','虎':'木','兔':'木','龙':'土','蛇':'火','马':'火','羊':'土','猴':'金','鸡':'金','狗':'土','猪':'水'};

/* ================= UI ================= */
const NUM_CN=['〇','一','二','三','四','五','六','七','八','九','十'];
function cnDay(d){
  const pre=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
   '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
   '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
  return pre[d-1];
}
(function init(){
  const ys=document.getElementById('year');
  for(let y=2025;y>=1900;y--){const o=document.createElement('option');o.value=y;o.textContent=y+' 年';ys.appendChild(o);}
  ys.value='2000';
  const ms=document.getElementById('month');
  for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=monthName(m)+'月';ms.appendChild(o);}
  ms.value='1';
  fillDays();fillLeap();
})();
function monthName(m){return ['正','二','三','四','五','六','七','八','九','十','冬','腊'][m-1];}
document.getElementById('month').addEventListener('change',()=>{fillDays();fillLeap();});
function fillDays(){
  const y=+document.getElementById('year').value,m=+document.getElementById('month').value;
  const ds=document.getElementById('day');ds.innerHTML='';
  for(let d=1;d<=monthDays(y,m);d++){const o=document.createElement('option');o.value=d;o.textContent=cnDay(d);ds.appendChild(o);}
  ds.value='1';
}
function fillLeap(){
  const y=+document.getElementById('year').value,m=+document.getElementById('month').value;
  const lp=document.getElementById('leap'),lm=leapMonth(y);
  lp.innerHTML='';
  const no=document.createElement('option');no.value='0';no.textContent='否';lp.appendChild(no);
  if(lm===m){const yes=document.createElement('option');yes.value='1';yes.textContent='闰'+monthName(lm)+'月';lp.appendChild(yes);}
}

/* ================= 主逻辑 ================= */
function query(){
  const errEl=document.getElementById('err');
  errEl.style.display='none';errEl.textContent='';
  const y=+document.getElementById('year').value,m=+document.getElementById('month').value,
        isLeap=document.getElementById('leap').value==='1',d=+document.getElementById('day').value;
  if(isLeap&&leapMonth(y)!==m){errEl.textContent=y+' 年没有闰'+monthName(m)+'月，请检查。';errEl.style.display='block';return;}
  const solar=lunarToSolar(y,m,d,isLeap);
  if(!solar||isNaN(solar)){errEl.textContent='换算失败，请检查输入。';errEl.style.display='block';return;}

  // 星座
  const sm=solar.getUTCMonth()+1,sd=solar.getUTCDate();
  const [em,ed,icon,name]=zodiacOf(sm,sd);

  // 年柱：以立春为界
  const lichun=new Date(Date.UTC(solar.getUTCFullYear(),1,jieDay(solar.getUTCFullYear(),2)));
  const gzYearBase = solar>=lichun ? solar.getUTCFullYear() : solar.getUTCFullYear()-1;
  const yearIdx=((gzYearBase-4)%60+60)%60; // 4 AD = 甲子
  const yGZ=ganzhiOf(yearIdx);

  // 月支：立春起寅月。jieDay(y,M)=M月“节”的日期
  const Y=solar.getUTCFullYear();
  const M=solar.getUTCMonth()+1,D=solar.getUTCDate();
  let mi; // 0=寅月 … 11=丑月
  if(M===1)      mi = D>=jieDay(Y,1)?11:10;   // 小寒后丑月，前为子月
  else if(M===2) mi = D>=jieDay(Y,2)?0:11;    // 立春后寅月
  else{
    mi=M-2;
    if(D<jieDay(Y,M)) mi--;                   // 未到该月“节”则退一月
    if(mi<0)mi+=12;
  }
  const zhiIdx=(mi+2)%12; // 寅=2
  // 五虎遁：年干甲己→丙寅起
  const firstMonthGan={0:2,5:2,1:4,6:4,2:6,7:6,3:8,8:8,4:0,9:0}[yearIdx%10];
  const ganIdx=(firstMonthGan+mi)%10;
  const mGZ=GAN[ganIdx]+ZHI[zhiIdx];

  // 日柱
  const dIdx=dayGZ(solar);
  const dGZ=ganzhiOf(dIdx);

  // 五行统计（三柱六字）
  const cnt={金:0,木:0,水:0,火:0,土:0};
  cnt[WX_GAN[GAN.indexOf(yGZ[0])]]++;cnt[WX_ZHI[yearIdx%12]]++;
  cnt[WX_GAN[ganIdx]]++;cnt[WX_ZHI[zhiIdx]]++;
  cnt[WX_GAN[GAN.indexOf(dGZ[0])]]++;cnt[WX_ZHI[dIdx%12]]++;

  // 生肖：以立春为界
  const sx=SX[((gzYearBase-4)%12+12)%12];

  // 渲染
  document.getElementById('zIcon').textContent=icon;
  document.getElementById('zName').textContent=name;
  document.getElementById('zRange').textContent='公历 '+String(em).padStart(2,'0')+' 月 '+ed+' 日 前后出生 · '+name+'（象性：'+Z_ELEMENT[name]+'）';
  document.getElementById('rSX').textContent=sx+'（'+SX_ELEMENTS[sx]+'）';
  document.getElementById('rYZ').textContent=yGZ;
  document.getElementById('rYX').innerHTML=wuxingStr(yGZ)+'　纳音象：'+naYin(gzYearBase);
  document.getElementById('rMZ').textContent=mGZ;
  document.getElementById('rMX').innerHTML=wuxingStr(mGZ);
  document.getElementById('rDZ').textContent=dGZ;
  document.getElementById('rDX').innerHTML=wuxingStr(dGZ)+'（日主）';
  document.getElementById('rWX').innerHTML=
    Object.keys(cnt).map(k=>'<span class="tag wx-'+mapWx(k)+'">'+k+' ×'+cnt[k]+'</span>').join('');
  const wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][solar.getUTCDay()];
  document.getElementById('rSolar').textContent=
    solar.getUTCFullYear()+'-'+String(sm).padStart(2,'0')+'-'+String(sd).padStart(2,'0')+' '+wd;

  const el=Z_ELEMENT[name];
  document.getElementById('rTraits').innerHTML=
    '🌟 <b>'+name+'</b>（'+el+'象性）：'+Z_TRAITS[name]+
    '<br>🐉 生肖 <b>'+sx+'</b> 五行属 <b>'+SX_ELEMENTS[sx]+'</b>；'+
    '日主 <b>'+dGZ[0]+ '</b>（'+WX_GAN[GAN.indexOf(dGZ[0])]+'），坐支 <b>'+dGZ[1]+'</b>（'+WX_ZHI[dIdx%12]+'）。';

  document.getElementById('result').style.display='block';
}

const NAYIN=['海中金','炉中火','大林木','路旁土','剑锋金','山头火','涧下水','城头土','白蜡金','杨柳木',
'泉中水','屋上土','霹雳火','松柏木','长流水','砂石金','山下火','平地木','壁上土','金箔金',
'覆灯火','天河水','大驿土','钗钏金','桑柘木','大溪水','沙中土','天上火','石榴木','大海水'];
function naYin(year){
  const idx=Math.floor((((year-4)%60)+60)%60/2);
  return NAYIN[idx];
}
